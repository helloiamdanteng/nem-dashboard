
  <svg viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <clipPath id="clip-dusk"><rect width="100" height="100"/></clipPath>

      <linearGradient id="skyDusk" x1="0" y1="0" x2="0.3" y2="1">
        <stop offset="0%" stop-color="#132a4d"/>
        <stop offset="45%" stop-color="#3d5f8a"/>
        <stop offset="78%" stop-color="#e8935a"/>
        <stop offset="100%" stop-color="#f6c667"/>
      </linearGradient>
      <linearGradient id="skyNight" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#0c1730"/>
        <stop offset="100%" stop-color="#050810"/>
      </linearGradient>
      <radialGradient id="sunGrad" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0%" stop-color="#fff6d8"/>
        <stop offset="100%" stop-color="#f2a13c"/>
      </radialGradient>
      <radialGradient id="moonGrad" cx="0.4" cy="0.4" r="0.6">
        <stop offset="0%" stop-color="#eaf6ff"/>
        <stop offset="100%" stop-color="#9fd3ef"/>
      </radialGradient>
      <linearGradient id="nightFillNight" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1c2a44"/>
        <stop offset="100%" stop-color="#0d1626"/>
      </linearGradient>
      <filter id="softBlur-dusk" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="3.2"/>
      </filter>
    </defs>

    <g clip-path="url(#clip-dusk)">
      <rect width="100" height="100" fill="url(#skyDusk)"/>

      
        <circle cx="76" cy="30" r="15" fill="#ffcf7d" opacity="0.35" filter="url(#softBlur-dusk)"/>
        <circle cx="76" cy="30" r="9.5" fill="url(#sunGrad)"/>
      

      <!-- cloud, drifting right next to the sun -->
      <g fill="#fff3e2" opacity="0.92">
        <ellipse cx="52" cy="27" rx="15" ry="5.2"/>
        <circle cx="45" cy="24" r="6"/>
        <circle cx="53" cy="20.5" r="7.6"/>
        <circle cx="61.5" cy="24" r="5.4"/>
      </g>

      <!-- wind lines -->
      <g fill="none" stroke="#fff3e2" stroke-width="1.3"
         stroke-linecap="round" opacity="0.55">
        <path d="M2,50 C7,48.3 10,51.3 15,49.6"/>
        <path d="M1,57 C7,55 11,58.6 17,56.6"/>
        <path d="M3,64 C8,62.3 11,65.3 15.5,63.7"/>
      </g>

      <!-- wind turbine, back -->
      <g stroke="none" stroke-width="0">
        <rect x="19" y="48" width="2" height="40" fill="#0e1626"/>
        <g transform="translate(20,48) rotate(-15)">
          <path d="M-1.4,0 C-1.4,0 -1.6,-8.1 0,-13 C1.6,-8.1 1.4,0 1.4,0 Z" fill="#0e1626"/>
          <path d="M-1.4,0 C-1.4,0 -1.6,-8.1 0,-13 C1.6,-8.1 1.4,0 1.4,0 Z" fill="#0e1626" transform="rotate(120)"/>
          <path d="M-1.4,0 C-1.4,0 -1.6,-8.1 0,-13 C1.6,-8.1 1.4,0 1.4,0 Z" fill="#0e1626" transform="rotate(240)"/>
          <circle r="1.6" fill="#0e1626"/>
        </g>
      </g>

      <!-- wind turbine, front -->
      <g stroke="none" stroke-width="0">
        <rect x="30.2" y="62" width="1.8" height="26" fill="#0e1626"/>
        <g transform="translate(31,62) rotate(20)">
          <path d="M-1.2,0 C-1.2,0 -1.4,-6.9 0,-11 C1.4,-6.9 1.2,0 1.2,0 Z" fill="#0e1626"/>
          <path d="M-1.2,0 C-1.2,0 -1.4,-6.9 0,-11 C1.4,-6.9 1.2,0 1.2,0 Z" fill="#0e1626" transform="rotate(120)"/>
          <path d="M-1.2,0 C-1.2,0 -1.4,-6.9 0,-11 C1.4,-6.9 1.2,0 1.2,0 Z" fill="#0e1626" transform="rotate(240)"/>
          <circle r="1.3" fill="#0e1626"/>
        </g>
      </g>

      <!-- cooling tower + chimney -->
      <g stroke="none" stroke-width="0">
        <path d="M40,88 C40,78 43.5,71 44.6,67 C45.3,64 44.6,60.5 44.3,57 L55.7,57 C55.4,60.5 54.7,64 55.4,67 C56.5,71 60,78 60,88 Z" fill="#0e1626"/>
        <rect x="64" y="63" width="4.5" height="25" rx="1" fill="#0e1626"/>
      </g>
      <ellipse cx="50" cy="51" rx="6" ry="3.6" fill="#eef2f7" opacity="0.75"/>
      <ellipse cx="47" cy="43" rx="8" ry="4.6" fill="#eef2f7" opacity="0.45"/>
      <ellipse cx="44" cy="34" rx="9.5" ry="5.4" fill="#eef2f7" opacity="0.22"/>
      <ellipse cx="66" cy="55" rx="4" ry="2.6" fill="#eef2f7" opacity="0.65"/>
      <ellipse cx="68" cy="48" rx="5.5" ry="3.2" fill="#eef2f7" opacity="0.35"/>
      

      <!-- solar array -->
      <g stroke="none" stroke-width="0">
        <rect x="1" y="-1" width="12" height="12" fill="#0e1626" transform="translate(69,82) skewX(-16)"/>
        <rect x="1" y="-1" width="12" height="12" fill="#0e1626" transform="translate(79,84) skewX(-16)"/>
        <rect x="1" y="-1" width="12" height="12" fill="#0e1626" transform="translate(89,86) skewX(-16)"/>
      </g>
      <g stroke="#3498db" stroke-width="0.5" opacity="0.75">
        <line x1="75" y1="75" x2="79" y2="93" /><line x1="79" y1="73" x2="83" y2="93" />
        <line x1="85" y1="77" x2="89" y2="95" /><line x1="89" y1="75" x2="93" y2="95" />
        <line x1="95" y1="79" x2="99" y2="97" /><line x1="99" y1="77" x2="103" y2="97" />
      </g>
    </g>
  </svg>